[package]
name = "fenestra-ui-exp-0008-hybrid-spatial"
description = "Disposable EXP-0008 hybrid spatial evidence probe for Fenestra"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
cpu-reference = ["dep:raqote", "dep:tiny-skia"]
default = []
image-resource = ["dep:image", "dep:png"]
numeric-spatial = ["dep:euclid", "dep:fixed", "dep:kurbo"]
path-hit = ["dep:kurbo", "dep:lyon_tessellation"]

[lints]
workspace = true

[dependencies]
fenestra-ui-ir.workspace = true
fenestra-ui-layout.workspace = true
fenestra-ui-runtime.workspace = true
fenestra-ui-spatial.workspace = true
euclid = { version = "=0.22.14", default-features = false, features = ["std"], optional = true }
fixed = { version = "=1.30.0", default-features = false, optional = true }
kurbo = { version = "=0.13.1", default-features = false, features = ["std"], optional = true }
lyon_tessellation = { version = "=1.0.20", default-features = false, features = ["std"], optional = true }
raqote = { version = "=0.8.5", default-features = false, optional = true }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
png = { version = "=0.18.1", default-features = false, optional = true }
