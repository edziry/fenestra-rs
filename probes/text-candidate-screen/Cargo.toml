[workspace]
members = ["common", "parley", "cosmic"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
accesskit_atspi_common = { path = "../../third-party/accesskit-atspi-common" }
