[package]
name = "fenestra-text-screen-cosmic"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native = ["fenestra-ui/native"]

[[bin]]
name = "text-pad"
path = "src/bin/text-pad.rs"
required-features = ["native"]

[lints]
workspace = true

[dependencies]
fenestra-text-screen-common = { path = "../common" }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
fenestra-ui = { path = "../../../crates/fenestra-ui" }
