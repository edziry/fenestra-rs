[package]
name = "fenestra-ui-exp-0001-native-spine"
description = "Disposable EXP-0001 native window spine probe for Fenestra"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fenestra-ui-runtime.workspace = true
fenestra-ui-spatial.workspace = true
fenestra-ui-testkit.workspace = true

[dev-dependencies]
fenestra-ui-layout.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-dlopen",
] }
softbuffer = { version = "=0.4.8", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = [
    "rwh_06",
] }
softbuffer = { version = "=0.4.8", default-features = false }
