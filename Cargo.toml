[workspace]
members = [
    "crates/fenestra-ui",
    "crates/fenestra-ui-authoring",
    "crates/fenestra-ui-ir",
    "crates/fenestra-ui-runtime",
    "crates/fenestra-ui-testkit",
    "probes/exp-0001-native-spine",
    "probes/exp-0001-spine",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/edziry/fenestra-rs"

[workspace.dependencies]
fenestra-ui = { path = "crates/fenestra-ui", version = "=0.1.0" }
fenestra-ui-authoring = { path = "crates/fenestra-ui-authoring", version = "=0.1.0" }
fenestra-ui-ir = { path = "crates/fenestra-ui-ir", version = "=0.1.0" }
fenestra-ui-runtime = { path = "crates/fenestra-ui-runtime", version = "=0.1.0" }
fenestra-ui-testkit = { path = "crates/fenestra-ui-testkit", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
