name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TERM_PROGRESS_WHEN: never

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Report Rust toolchain
        run: rustup show active-toolchain

      - name: Verify manifests
        run: cargo metadata --format-version 1 --no-deps --locked

      - name: Check dependency graph
        run: cargo tree --workspace --edges normal --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Report Rust toolchain
        run: rustup show active-toolchain

      - name: Build and run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Verify typed authoring contract on Windows paths
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\fenestra target with spaces
        run: |
          function Assert-NativeSuccess {
            param([string]$Command, [int]$ExitCode)
            if ($ExitCode -ne 0) {
              throw "$Command exited with code $ExitCode"
            }
          }
          cargo fmt --all -- --check
          Assert-NativeSuccess "cargo fmt" $LASTEXITCODE
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          Assert-NativeSuccess "cargo clippy" $LASTEXITCODE
          $env:RUSTDOCFLAGS = "-D warnings -D missing-docs"
          cargo doc --workspace --all-features --no-deps --locked
          Assert-NativeSuccess "cargo doc" $LASTEXITCODE
          Remove-Item Env:RUSTDOCFLAGS
          cargo metadata --format-version 1 --no-deps --locked | Out-Null
          Assert-NativeSuccess "cargo metadata" $LASTEXITCODE
          cargo tree -p fenestra-ui-authoring --edges normal --locked
          Assert-NativeSuccess "cargo tree authoring" $LASTEXITCODE
          cargo tree -p fenestra-ui-macros --edges all --locked
          Assert-NativeSuccess "cargo tree macros" $LASTEXITCODE
          cargo tree -p fenestra-ui-exp-0007-typed-authoring --edges normal,no-proc-macro --locked
          Assert-NativeSuccess "cargo tree probe normal" $LASTEXITCODE
          cargo tree -p fenestra-ui-exp-0007-typed-authoring --target all --edges all --locked
          Assert-NativeSuccess "cargo tree probe all" $LASTEXITCODE
          cargo test -p fenestra-ui-exp-0007-typed-authoring --all-targets --all-features --locked
          Assert-NativeSuccess "cargo test probe" $LASTEXITCODE
          $generated = @(Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter layout_board_fen_v1.rs)
          if ($generated.Count -ne 1) {
            throw "expected one generated typed-authoring source, found $($generated.Count)"
          }
          $expected = "b633d1f01c0da43827925ae245e095a02aa87a8229d870a1cbee9f2f5adf42de"
          $observed = (Get-FileHash -Algorithm SHA256 $generated[0].FullName).Hash.ToLowerInvariant()
          if ($observed -ne $expected) {
            throw "generated typed-authoring source hash mismatch"
          }
          git diff --check
          Assert-NativeSuccess "git diff --check" $LASTEXITCODE
