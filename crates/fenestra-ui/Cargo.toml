[package]
name = "fenestra-ui"
description = "Unpublished facade for the experimental Fenestra UI workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:winit", "dep:softbuffer"]

[dependencies]
fenestra-ui-ir.workspace = true
fenestra-ui-runtime.workspace = true
fenestra-ui-spatial.workspace = true
fenestra-ui-macros.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "windows")'.dependencies]
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false }

[lints]
workspace = true
