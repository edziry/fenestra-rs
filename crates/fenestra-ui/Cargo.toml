[package]
name = "fenestra-ui"
description = "Unpublished facade for the experimental Fenestra UI workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = []
native = ["dep:winit", "dep:softbuffer", "dep:accesskit", "dep:accesskit_winit"]

[dependencies]
fenestra-ui-ir.workspace = true
fenestra-ui-runtime.workspace = true
fenestra-ui-spatial.workspace = true
fenestra-ui-macros.workspace = true
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit = { version = "=0.25.0", optional = true, default-features = false }
accesskit_winit = { version = "=0.34.0", optional = true, default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false, features = ["wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit = { version = "=0.25.0", optional = true, default-features = false }
accesskit_winit = { version = "=0.34.0", optional = true, default-features = false, features = ["rwh_06"] }
winit = { version = "=0.30.13", optional = true, default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", optional = true, default-features = false }

[lints]
workspace = true
