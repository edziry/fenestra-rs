[package]
name = "fenestra-controls-app"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
native = ["fenestra-ui/native"]

[dependencies]
fenestra-ui = { path = "../../crates/fenestra-ui" }
fenestra-ui-text = { path = "../../crates/fenestra-ui-text" }

[build-dependencies]
fenestra-ui-authoring = { path = "../../crates/fenestra-ui-authoring" }

[dev-dependencies]
serde_json = "=1.0.151"

[[example]]
name = "a11y-probe"
required-features = ["native"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[patch.crates-io]
accesskit_atspi_common = { path = "../../third-party/accesskit-atspi-common" }
